[plugin]
name = "Endless"
version = "0.1.0"

# Runtime 0.26.0 names (title.rows, levels.serve, levels.flow, player.place, assets.read, [script.overrides]).
[script]
runtime = "com.necrosis.script-runtime"
entry = "scripts/main.lua"
requires = ["events.lifecycle", "timers", "events.script", "events.zone", "storage.settings", "title.rows", "levels.serve", "levels.flow", "player.place", "assets.read", "world.read", "script.flags"]
# characters.powers (0.28.0): the companions' hidden thaumaturgy is granted at runtime
optional = ["characters.read", "characters.powers", "player.damage", "player.push", "levels.drive", "world.levers"]

[script.modules]
"gen" = "scripts/gen.lua"

# runtime 0.26.0-dev: our roles database (companion roles) replaces the game's at startup
[script.overrides]
"Resource.rpk/charroles.rdb" = "assets/charroles.rdb"
