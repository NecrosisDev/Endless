name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the mod and its release ZIP
        run: python -X utf8 -B release.py --without-private
      - uses: actions/upload-artifact@v7
        with:
          name: endless
          path: dist/*.zip*
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the tagged release ZIP
        run: python -X utf8 -B release.py --without-private --tag "$GITHUB_REF_NAME"
      # A tag with a hyphen (v0.2.0-rc1) publishes a prerelease. An existing release is never replaced.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --title "Endless $GITHUB_REF_NAME" --generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --repo "$GITHUB_REPOSITORY" "${flags[@]}"
